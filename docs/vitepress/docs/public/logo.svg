<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <!-- Tilted Block (Roblox/Luau Geometry) -->
  <rect x="6" y="6" width="20" height="20" rx="4.5" transform="rotate(45 16 16)" fill="#FF2442"/>
  
  <!-- Neural Synapse Channel -->
  <line x1="8" y1="16" x2="24" y2="16" stroke="#0E1015" stroke-width="3" stroke-linecap="round"/>

  <!-- 3 Neural Nodes (Input - Hidden - Output) -->
  <circle cx="8" cy="16" r="2.8" fill="#FFFFFF"/>
  <circle cx="16" cy="16" r="2.8" fill="#0E1015"/>
  <circle cx="24" cy="16" r="2.8" fill="#FFFFFF"/>
</svg>